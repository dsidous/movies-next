name: Deploy Next.js to AWS
on:
  push:
    branches: [main]
  workflow_dispatch: # This enables the manual 'Run workflow' button
    
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install Bun
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Check required configuration
        run: |
          if [ -z "${SST_SITE_DOMAIN}" ]; then
            echo "::error::Set the Actions variable SST_SITE_DOMAIN (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
        env:
          SST_SITE_DOMAIN: ${{ vars.SST_SITE_DOMAIN }}

      - name: Install SST Providers
        run: npx sst install
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # SST_SITE_DOMAIN is required. Other SST_* vars are optional (see sst.config.ts).
          SST_APP_NAME: ${{ vars.SST_APP_NAME }}
          SST_SITE_DOMAIN: ${{ vars.SST_SITE_DOMAIN }}
          SST_NEXTJS_NAME: ${{ vars.SST_NEXTJS_NAME }}
          SST_CLOUDFLARE_PROVIDER_VERSION: ${{ vars.SST_CLOUDFLARE_PROVIDER_VERSION }}
          SST_RETAIN_STAGES: ${{ vars.SST_RETAIN_STAGES }}

      # 3. Deploy with SST
      - name: Deploy with SST
        run: npx sst deploy --stage prod --print-logs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SST_APP_NAME: ${{ vars.SST_APP_NAME }}
          SST_SITE_DOMAIN: ${{ vars.SST_SITE_DOMAIN }}
          SST_NEXTJS_NAME: ${{ vars.SST_NEXTJS_NAME }}
          SST_CLOUDFLARE_PROVIDER_VERSION: ${{ vars.SST_CLOUDFLARE_PROVIDER_VERSION }}
          SST_RETAIN_STAGES: ${{ vars.SST_RETAIN_STAGES }}
          # These are passed to the build process for Next.js
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          TMDB_BASE_URL: ${{ secrets.TMDB_BASE_URL }}
