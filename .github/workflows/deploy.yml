name: Deploy Next.js to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: # This enables the manual 'Run workflow' button

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Cloudflare Worker
        run: bun run build:cloudflare
        env:
          # Build-time values: TMDB is needed for static generation of
          # movie/TV/person pages; NEXT_PUBLIC_* are inlined into the client bundle.
          TMDB_BASE_URL: ${{ secrets.TMDB_BASE_URL }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Deploy Worker
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply Cloudflare security settings
        run: bash scripts/cloudflare-security.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SST_SITE_DOMAIN: ${{ vars.SST_SITE_DOMAIN }}

      - name: Set runtime secrets
        run: |
          printf '%s' "$TMDB_API_TOKEN" | bunx wrangler secret put TMDB_API_TOKEN
          printf '%s' "$CLERK_SECRET_KEY" | bunx wrangler secret put CLERK_SECRET_KEY
          printf '%s' "$CLERK_WEBHOOK_SECRET" | bunx wrangler secret put CLERK_WEBHOOK_SECRET
          printf '%s' "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" | bunx wrangler secret put NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
          printf '%s' "$NEXT_PUBLIC_SUPABASE_ANON_KEY" | bunx wrangler secret put NEXT_PUBLIC_SUPABASE_ANON_KEY
          printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | bunx wrangler secret put NEXT_PUBLIC_SUPABASE_URL
          printf '%s' "$AI_SEARCH_BASE_URL" | bunx wrangler secret put AI_SEARCH_BASE_URL
          printf '%s' "$AI_SEARCH_SERVICE_KEY" | bunx wrangler secret put AI_SEARCH_SERVICE_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          AI_SEARCH_BASE_URL: ${{ secrets.AI_SEARCH_BASE_URL }}
          AI_SEARCH_SERVICE_KEY: ${{ secrets.AI_SEARCH_SERVICE_KEY }}
