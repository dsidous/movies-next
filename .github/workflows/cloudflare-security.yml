name: Apply Cloudflare Security

on:
  push:
    branches: [main]
    paths:
      - 'scripts/cloudflare-security.sh'
  workflow_dispatch: # This enables the manual 'Run workflow' button

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Cloudflare security settings
        run: bash scripts/cloudflare-security.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SST_SITE_DOMAIN: ${{ vars.SST_SITE_DOMAIN }}
